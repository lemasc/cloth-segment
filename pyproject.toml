[project]
name = "cloth-segment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lemasc Service", email = "lemascserviceth@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch==2.14.1",
    "torchvision>=0.29.1",
    "transformers<5",
]

[project.scripts]
cloth-segment = "cloth_segment:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pytest>=9.2.0",
]
