[project]
name = "cloth-segment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lemasc Service", email = "lemascserviceth@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "segmentation-models-pytorch>=0.6.0",
    "torch==2.14.1",
    "torchvision>=0.29.1",
    "transformers<5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["datasets", "data", "runs"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# NPY: numpy pitfalls, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]
ignore = ["B905"]  # zip(strict=) is too noisy for this codebase

[tool.pytest.ini_options]
testpaths = ["tests"]
