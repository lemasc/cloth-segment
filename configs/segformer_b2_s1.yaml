# Plain SegFormer-B2 with seed 1, the reference for the multi-task run
# (segformer_b2_mt.yaml). Same as segformer_b2.yaml except the seed; the seed-0
# config has the same hash as segformer_b2.yaml, so the run cache would skip it.
# Also a second seed of SegFormer-B2.
seed: 1
run:
  overrides_shared: [seed]

model:
  name: segformer_b2
  pretrained: true
  classifier_dropout: 0.1   # Dropout2d before the classifier, as in the original B2
