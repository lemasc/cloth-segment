# M11 LIP multi-person check: runs, rules and where results go.
# Read by scripts/multiperson.py (GPU) and scripts/m11_results.py (no GPU).
# Not a training config: it has no run hash and changes no run.

runs: # alias -> run folder and model name (same as configs/report/t10.yaml)
  X2: {name: 20261105-1307-1acb88f-unet-r34, model: U-Net R34}
  X3: {name: 20261105-2050-f4e2ffe-deeplabv3p-r50, model: DeepLabV3+ R50}
  X4: {name: 20261105-2220-ac9a26b-segformer-b2, model: SegFormer-B2}

# Test set -> runs to predict. CIHP (every person labelled) is the contrast.
jobs:
  lip: [X2, X3, X4]
  cihp: [X4]

edge_frac: 0.01 # T10 headline edge band (share of the image diagonal)
# Blob-ignore thresholds: an interior false-person component of at least this
# share of the image is left out of the analysis score. 0.01 is the headline.
blob_shares: [0.005, 0.01, 0.02]
headline_share: 0.01
tops: [0.01, 0.05, 0.1, 0.25] # concentration: share held by the top images
exclude: [accessory] # headline mIoU rule (M6), as in T9 and T10

out_dir: analysis/M11 # under data/ (shared mount): per run and test set, JSON + per-image CSV

# Visual check: the run and test set whose predictions are saved and drawn.
review:
  run: X4
  dataset: lip
  top: 30 # images with the most interior false-person pixels
  random: 15 # plus a random draw from the rest with at least `random_min_px`
  random_min_px: 200
  seed: 0
  tile: 300 # tile height in pixels
  per_sheet: 6
  out_dir: review/M11 # under data/: saved predictions, samples.csv, sheets (dataset images)

# One row per drawn image (n matches samples.csv). Read by AI (Claude
# subagent); see the M11 report for how the verdicts were made.
verdicts: docs/reports/2026-11-08-M11-verdicts.csv
verdict_codes:
  other_person: other person(s) parsed
  main_annotation_missing: main person not (fully) annotated in GT
  object_clutter: object or clutter
  mannequin_poster: mannequin, poster or reflection
  unclear: unclear

out: # repo paths, committed (small JSON and Markdown; no dataset images)
  json: docs/reports/2026-11-08-M11-results.json
  tables: docs/reports/2026-11-08-M11-tables.md
