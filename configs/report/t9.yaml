# T9 evaluation report: which runs to compare and where the results go.
# Read by scripts/t9_results.py. Not a training config: it has no run hash and
# changes no run. Official scores come from each run's test metrics.json
# (frozen eval protocol); everything else here is analysis on top of them.

runs: # alias -> run folder and model name (X rows of docs/PLAN.md)
  X2: {name: 20261105-1307-1acb88f-unet-r34, model: U-Net R34}
  X3: {name: 20261105-2050-f4e2ffe-deeplabv3p-r50, model: DeepLabV3+ R50}
  X4: {name: 20261105-2220-ac9a26b-segformer-b2, model: SegFormer-B2}

datasets: [lip, cihp, dfmm] # test sets (D4)

# Per-image and per-raw-class counts from scripts/raw_class_breakdown.py (M10), under data/.
breakdown_dir: review/M10/breakdown

# Headline mIoU leaves these classes out (M6 decision); 12-class mIoU is reported too.
exclude: [accessory]

# Extra scores decided in M10 (d1, d2): raw-class pixels counted as IGNORE on the
# test side only. Reported next to the official score, never instead of it.
adjusted:
  d1: {dataset: lip, cls: dress, raw: [jumpsuits]}
  d2: {dataset: cihp, cls: footwear, raw: [socks]}

# Paired bootstrap over test images (same resamples for every run).
bootstrap: {n: 2000, seed: 0, level: 0.95}

out: # repo paths, committed (small JSON, Markdown and PNG; no dataset images)
  json: docs/reports/2026-11-07-T9-results.json
  tables: docs/reports/2026-11-07-T9-tables.md
  figures: docs/reports/figures/T9
