# Multi-task: SegFormer-B2 + DFMM attribute heads on the shared encoder.
# Overrides model.* and the seed only; the other shared fields stay in
# base.yaml. Seed 1, not 0: the reference is segformer_b2_s1.yaml, because a
# seed-0 plain run has the same hash as segformer_b2.yaml and the run cache
# would skip it. Apart from model.attr, the two resolve to the same config. The checkpoint
# rule (eval.select) stays segmentation-only.
# Choice of heads and values: 12 shape attributes. Texture attributes (fabric_*, pattern_*)
# are not heads: very skewed, many values with < 20 test items, outer 80% NA.
seed: 1
run:
  overrides_shared: [seed]

model:
  name: segformer_b2_mt
  pretrained: true
  classifier_dropout: 0.1
  attr:
    heads: [sleeve, lower_length, socks, hat, glasses, neckwear, wrist, ring,
            waist_acc, neckline, outer_cardigan, covers_navel]
    ignore_values:
      sleeve: [not_long]             # 6 train, 0 test; ill-defined
      glasses: [in_hand_or_clothes]  # 16 train, 5 test; not worn
    loss_weight: 0.1   # L = L_seg + 0.1 * L_attr; keeps the attribute term well below seg CE
    hidden: 256
    dropout: 0.2
