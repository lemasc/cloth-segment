# T10 visual review: are CIHP `dress` labels on upper-body garments label errors?
# Read by scripts/review_predictions.py (picks images, saves predicted masks)
# and notebooks/review/visual_review.py (shows them, saves verdicts).
# Not a training config: it has no run hash and changes no run.
#
# Why: in the T9 grids CIHP labels some tops and a doctor's coat as `dress`, and
# all three models predict upper/outer there. In 166 of 936 CIHP test images with
# `dress` (9.2% of its pixels) all three models find under 10% of it (T10).

title: "T10 — Is CIHP `dress` sometimes a label error?"
out_dir: review/T10 # under data/ (shared mount); predicted masks and sample list
breakdown_dir: review/M10/breakdown # under data/; output of scripts/raw_class_breakdown.py
verdicts: docs/reports/2026-11-07-T10-verdicts.csv # reviewer input, committed

runs: # alias -> run folder, the three comparison runs
  X2: 20261105-1307-1acb88f-unet-r34
  X3: 20261105-2050-f4e2ffe-deeplabv3p-r50
  X4: 20261105-2220-ac9a26b-segformer-b2

# "Worst" = lowest X4 recall: the images all models miss, where a wrong label
# is most likely. "Random" = typical images, so label errors are not over-counted.
rank_run: X4
seed: 0

questions:
  q1_cihp_dress:
    title: "CIHP dress"
    datasets: [cihp]
    raw: [dress]
    min_share: 0.02 # dress covers at least 2% of the image, so it is visible
    n_worst: 12
    n_random: 12
    verdicts:
      W: wrong label (clearly not a dress, e.g. top, coat, shirt, trousers)
      G: in-between garment (long top, tunic, robe, coat-dress); dress is defensible
      M: clear dress, labelled right (a miss is a model mistake)
      A: cannot tell

decisions:
  d5_cihp_dress:
    title: "CIHP dress labels (T10)"
    options:
      limitation: write it as a limitation in T10
      model_error: treat misses as model error in T10 error analysis
      frozen_change: frozen-change to the label mapping and retrain X2-X4
