# T9 qualitative comparison: which test images to draw for every run.
# Read by scripts/review_predictions.py (picks images, saves predicted masks
# under data/<out_dir>/) and scripts/t9_qualitative.py (draws the grids).
# Not a training config: it has no run hash and changes no run.

out_dir: review/T9 # under data/ (shared mount); predicted masks and sample list
breakdown_dir: review/M10/breakdown # under data/; output of scripts/raw_class_breakdown.py

runs: # alias -> run folder, the three comparison runs (same as configs/report/t9.yaml)
  X2: 20261105-1307-1acb88f-unet-r34
  X3: 20261105-2050-f4e2ffe-deeplabv3p-r50
  X4: 20261105-2220-ac9a26b-segformer-b2

# "Worst" = lowest garment recall of X4, the strongest model, so they show
# what all three still miss. "Random" shows typical images.
rank_run: X4
seed: 0

# One "question" per test set: the raw garment classes of that dataset. An image
# is a candidate when its garments cover at least min_share of the image.
# No reviewer verdicts in T9: the grids are figures, not a review.
questions:
  lip:
    title: "LIP test: garments"
    datasets: [lip]
    raw: [upper_clothes, coat, dress, skirt, pants, jumpsuits]
    min_share: 0.05
    n_worst: 3
    n_random: 5
    verdicts: {}
  cihp:
    title: "CIHP test: garments"
    datasets: [cihp]
    raw: [upper_clothes, coat, dress, skirt, pants]
    min_share: 0.05
    n_worst: 3
    n_random: 5
    verdicts: {}
  dfmm:
    title: "DFMM test: garments"
    datasets: [dfmm]
    raw: [top, outer, skirt, dress, pants, rompers]
    min_share: 0.05
    n_worst: 3
    n_random: 5
    verdicts: {}

# Grids (scripts/t9_qualitative.py): one JPEG per test set, under data/ (shared
# mount). They contain dataset photos, so they are never committed (CONTRIBUTING 8-9).
figures: review/T9/figures
panel_height: 300 # pixels per panel row
jpeg_quality: 82
run_models: # column titles of the grids
  X2: U-Net R34
  X3: DeepLabV3+ R50
  X4: SegFormer-B2
