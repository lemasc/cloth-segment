# Install once per clone:  uv run pre-commit install
# Run on everything:       uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]   # notebooks with committed outputs may be a few MB
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: local
    hooks:
      # Run through uv so the version is the one pinned in uv.lock.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      # Jupyter notebooks (analysis/) keep their outputs. This only drops
      # volatile metadata (widget state, cell ids' noise) so diffs stay small.
      - id: nbstripout
        name: nbstripout (keep outputs)
        entry: uv run nbstripout --keep-output --keep-count
        language: system
        files: \.ipynb$
